# Production stack for one EC2 host:
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# Public:  caddy (80/443, HTTPS) -> api
# Private: api, worker, model, db (no published ports; model and db have no route to the internet)
name: airwatch

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  JWT_SECRET: ${JWT_SECRET}
  MODEL_API_URL: http://model:8000
  CLIENT_ORIGIN: ${CLIENT_ORIGIN}
  BACKGROUND_PROVIDER: ${BACKGROUND_PROVIDER:-simulated}
  WEATHER_PROVIDER: ${WEATHER_PROVIDER:-simulated}
  SIMULATOR_TOKEN_SECRET: ${SIMULATOR_TOKEN_SECRET}
  SIMULATOR_SEED: ${SIMULATOR_SEED:-airwatch-demo}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  model:
    build:
      context: ./adaptive-aqi-model
      dockerfile: ../deploy/model.Dockerfile
    restart: unless-stopped
    volumes:
      # The trained artifact, copied to the host separately. Read-only.
      - ./adaptive-aqi-model/models:/app/models:ro
    networks: [private]

  migrate:
    build: ./server
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/seed.js"]
    restart: "no"
    environment:
      <<: *app-env
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      DEMO_CITIZEN_PASSWORD: ${DEMO_CITIZEN_PASSWORD:-}
      DEMO_OFFICER_PASSWORD: ${DEMO_OFFICER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  api:
    build: ./server
    restart: unless-stopped
    environment:
      <<: *app-env
      SIMULATOR_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      model:
        condition: service_started
    networks: [private, edge]

  # Device simulator: uploads to the API over HTTP with device credentials, like field devices.
  worker:
    build: ./server
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INGEST_URL: http://api:4000
      SIMULATOR_BATCH_MINUTES: ${SIMULATOR_BATCH_MINUTES:-1}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # No route to the internet and no published ports.
  private:
    internal: true
  edge:
